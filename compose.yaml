name: agentbus

services:
  db:
    image: postgres:17
    # Host networking on purpose: Tailscale installs `from all lookup 52` with a default
    # route, so the host cannot reach docker bridge subnets at all. With host networking
    # Postgres listens on 127.0.0.1 only, which is both reachable and not exposed to LAN.
    network_mode: host
    command: ["postgres", "-p", "5455", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: agentbus
      POSTGRES_PASSWORD: agentbus
      POSTGRES_DB: agentbus
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5455 -U agentbus"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
